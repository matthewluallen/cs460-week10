; EXPERIMENTAL — dual USB-CDC reference for the Cardputer analyzer.
; Proves the ESP32-S3 can expose TWO independent serial ports on one USB cable, so the
; WebSerial app (port 0) and a serial client like pyserial (port 1) can attach AT THE SAME
; TIME — which the production analyzer's single USB-Serial/JTAG console (ARDUINO_USB_MODE=1)
; cannot. This is a bench-test starting point, NOT the shipped firmware. Flash it, open both
; /dev/cu.usbmodem* ports, and confirm each echoes independently before porting the full
; analyzer to this USB stack. Build: pio run -e cardputer_dualcdc
[env:cardputer_dualcdc]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0      ; TinyUSB stack (NOT the USB-Serial/JTAG HWCDC the prod analyzer uses)
    -DCFG_TUD_CDC=2           ; two CDC-ACM interfaces -> two host serial ports
    -Wno-unused-variable
    -Wno-unused-function
lib_deps =
    m5stack/M5Cardputer
