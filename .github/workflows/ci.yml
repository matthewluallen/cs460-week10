name: CI

# Runs the test harnesses that already live in the repo so a firmware / image /
# Studio regression is caught automatically, and the committed prebuilt binaries are
# verified on every change. Before this workflow the harnesses existed but nothing ran
# them (smoke-test.py even claimed "caught in CI" while no CI existed).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuilt-integrity:
    # Fast gate: the committed firmware prebuilts must match their recorded hashes,
    # so a stale or accidentally-changed image can't ship unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify prebuilt firmware checksums
        working-directory: sbom/firmware/prebuilt
        run: sha256sum -c SHA256SUMS.txt

  bench-tests:
    # Offline byte-stream unit tests for the capture/USB-install tooling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: capture tests
        working-directory: tools/bench
        run: python -m unittest -v test_capture

  studio-regression:
    # Headless Playwright check of the Logic Studio: every example project loads clean,
    # compiles to IR, builds deployment text, and keeps the ST<->ladder pairing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run Studio regression harness
        run: node tools/studio-regression.js

  twin-smoke:
    # Boots the committed prebuilt firmware in the QEMU twin and asserts the Week-10
    # invariants (boot, i2cscan, control, interlock, OTA, HMI, bus decode, NTP/Y2038,
    # overflow). This is the "caught in CI" check smoke-test.py refers to.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sigrok-cli + xz (bus-decode leg + twin unpack)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sigrok-cli xz-utils
      - name: Fetch the QEMU twin for this release
        env:
          GH_TOKEN: ${{ github.token }}   # lets gh download the (same-repo) release asset
        run: ./qemu/fetch-qemu.sh
      - name: Smoke-test the twin
        run: python qemu/smoke-test.py

  lab-verify:
    # Runs the per-part assessment anchors (assessment/verify-lab.py) against the twin, so
    # the gradeable checks students rely on are proven to pass on a clean build. Same checks
    # run on a physical StampLC over USB (SERIAL_PORT=...). Part 9 needs the secure build and
    # is exercised separately; P2/P4/P7 SKIP here (no SBOM outputs / Playwright / malicious image).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch the QEMU twin for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./qemu/fetch-qemu.sh
      - name: Verify lab parts on the twin
        run: python assessment/verify-lab.py --boot-twin P1 P3 P5 P6 P8

  formal-verify:
    # Week 12 / Level 3: Z3 must prove every security control on the verified build. This is the
    # formal-verify stage of the assurance pipeline running as a CI gate — a regression that
    # re-opens a control (makes its violation satisfiable again) fails the build here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Z3
        run: pip install z3-solver
      - name: Prove the controls (verified build)
        run: python formal-verify/verify_controls.py --profile verified --assert-proven
