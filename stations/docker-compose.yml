# CS460 — StampLC as separate real-world stations on one OT network.
#
# Four nodes on a real Docker network (the "plant"), speaking real protocols you can
# capture with Wireshark — the multi-station model from the wind-turbine lab, applied to
# the StampLC. No wind farm here; this stack stands alone.
#
#   plc       10.20.30.10   the controller — the QEMU twin + bridge (Modbus :502, HTTP :80, Studio :8080)
#   hmi       10.20.30.20   a SCADA HMI that polls the controller over Modbus (dashboard :8800)
#   engineer  10.20.30.30   an engineering/attacker workstation — a Modbus master
#   mqtt      10.20.30.40   the phone broker + sensor page (MQTT :1883, phone page / MQTT-over-WS :8090)
#   capture                 a passive sniffer (Wireshark/tshark) watching the plant network
#                           (Modbus :502, DNP3 :20000, MQTT :1883, phone MQTT-over-WS :8090)
#
# First (once, in the repo root, so the twin is present for the mounted plc station):
#   ./qemu/fetch-qemu.sh
# Then:
#   docker compose -f stations/docker-compose.yml up --build
#
# In a Codespace, forward ports 8800 (HMI) and 8080 (Studio) from the Ports tab.

name: cs460-stations

networks:
  plant:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.30.0/24

services:
  plc:
    build:
      context: ./plc
    image: cs460/plc-station
    working_dir: /work
    volumes:
      - ..:/work                 # the repo (with the fetched twin) — the controller's software
    environment:
      - PROFILE=vuln             # vuln | secure | malicious
    networks:
      plant:
        ipv4_address: 10.20.30.10
    ports:
      - "8080:8080"              # Logic Studio + /modbus proxy + console (same-origin)
    # binds the controller's own Modbus :502 and HTTP :80 on the plant network (W5_BIND=0.0.0.0)

  hmi:
    # Node-RED HMI (replaces the old hmi.py page): students see the HMI *wiring* (the flow
    # editor on :1880) and the *UI design* (the dashboard on :1880/ui). node-red-contrib-modbus
    # polls the StampLC twin over Modbus/TCP; node-red-dashboard renders the gauges + LEDs.
    build:
      context: ./hmi-nodered     # flows.json + settings.js + Dockerfile all in this dir
      dockerfile: Dockerfile
    image: cs460/hmi-nodered
    environment:
      - PLC_HOST=10.20.30.10
    depends_on: [plc]
    networks:
      plant:
        ipv4_address: 10.20.30.20
    ports:
      - "8800:1880"              # host 8800 -> Node-RED editor (/ ) and dashboard (/ui)

  engineer:
    build:
      context: .
      dockerfile: engineer/Dockerfile
    image: cs460/engineer-station
    environment:
      - PLC_HOST=10.20.30.10
    depends_on: [plc]
    networks:
      - plant                    # dynamic IP: lets `docker compose run engineer …` spin up
                                 # ad-hoc write sessions without an address clash
    # default command polls the controller; to command it over the network, run e.g.:
    #   docker compose -f stations/docker-compose.yml run --rm engineer python3 /app/engineer.py write-coil relay2 1
    #   docker compose -f stations/docker-compose.yml run --rm engineer python3 /app/engineer.py write-setpoint 321

  mqtt:
    build:
      context: ../mqtt            # repo-root mqtt/ bridge (broker + sensor page + QR)
    image: cs460/mqtt-bridge
    networks:
      plant:
        ipv4_address: 10.20.30.40
    ports:
      - "8090:8090"              # the phone sensor page + QR + MQTT-over-WebSocket (make PUBLIC)
      - "1883:1883"              # MQTT/TCP — the twin (plc) subscribes here
    # Phones reach :8090 over the Codespace public forward and publish their sensors; the plc
    # station's entrypoint runs `mqtt connect 10.20.30.40` once the twin is up, so the controller
    # subscribes to phone/+/… here and maps them to NETWORK points (never to the IN1–IN8 terminals).

  capture:
    build:
      context: .
      dockerfile: capture/Dockerfile
    image: cs460/capture-station
    network_mode: host           # see unicast traffic BETWEEN containers on the plant bridge
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./captures:/captures
    depends_on: [plc, hmi]
