[platformio]
default_envs = m5stamplc

[env:m5stamplc]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:scripts/point_map_check.py
    pre:scripts/config_explain_check.py
    post:scripts/m5stamplc_compat.py
    post:scripts/ethernet_compat.py
    post:scripts/build_profile_check.py
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; ESP32-S3 specific settings
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv

; Memory configuration
board_upload.flash_size = 8MB
board_upload.wait_for_upload_port = true

; Libraries
lib_deps =
    ArduinoJson@6.21.6
    knolleary/PubSubClient@2.8
    m5stack/M5StamPLC@1.2.0
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    adafruit/Adafruit BME680 Library@2.0.6
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    khoih-prog/Ethernet_Generic@2.8.1

; Match the preserved physical partition table: two 0x330000-byte OTA slots.
board_upload.maximum_size = 3342336

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Compiler flags
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCORE_DEBUG_LEVEL=3
    -DUSE_ESP_IDF_LOG
    -DBOARD_M5STAMPLC
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DENABLE_OPENPLC
    -DENABLE_MODBUS_TCP
    -DENABLE_OTA
    -DENABLE_WEB_HMI
    -DENABLE_DEBUG_TELNET
    -DENABLE_CWE_DEMOS
    -DENABLE_PLC_VM
    -DENABLE_PLC_LOADER
    -DENABLE_GROVE_UNITS
    -DENABLE_ETHERNET
    -Wno-unused-variable
    -Wno-unused-function

; Upload method
upload_protocol = esptool
upload_speed = 921600

; Local-bus acceptance profile: same controller/worker, no Ethernet stack.
; Wi-Fi must also be OFF in the saved configuration for the serial-only test.
[env:rtu_serial_only]
extends = env:m5stamplc
build_unflags = -DENABLE_ETHERNET

; ── SECURE / HARDENED build ──────────────────────────────────────────────────
; Both profiles load the same project format; a project cannot select this flag.
; ENABLE_CWE_DEMOS preserves the teaching weaknesses in the default build.
; This env removes it and defines SECURE_BUILD to select the existing guarded
; remediation branches. The profile name is not a claim of complete security;
; remediation/README.md records direct fixes, compensating controls and gaps.
;     pio run -e m5stamplc            # teaching build (weaknesses present)
;     pio run -e m5stamplc_secure     # secure comparison profile (scoped controls)
; Diff the two images, or verify a student's own fix compiles clean.
[env:m5stamplc_secure]
extends = env:m5stamplc
build_unflags = -DENABLE_CWE_DEMOS
build_flags = ${env:m5stamplc.build_flags} -DSECURE_BUILD
